<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link rel="stylesheet" href="learnToPlay.css">
    <script src="learnToPlay.js" defer></script>
    <title>Learn To Play</title>
</head>
<body>
    <header>
        <nav id="navPages">
            <div class="navbarPages">
                <a id="navItemHome" class="nav-item nav-link" href="#">Magic: The Gathering</a>
                <a id="navItem" class="nav-item nav-link" href="/homePage/index.html">HOME</a>
                <a id="navItem" class="nav-item nav-link" href="#">LEARN TO PLAY</a>
                <a id="navItem" class="nav-item nav-link" href="#">THE COLORS</a>
                <a id="navItem" class="nav-item nav-link" href="#">THE ANATOMY</a>
                <a id="navItem" class="nav-item nav-link" href="#">COMMANDER</a>
            </div>
        </nav>
    </header>

    <main>
        <div class="learnToPlayContainer">
            <div class="learnToPlayContent">
                <div class="ruleContainer">

                    <div class="rules">
                        <div id="rule">
                            <p>How to win</p>
                            <ul>
                                <li>Item 1</li>
                                <li>Item 2</li>
                                <li>Item 3</li>
                            </ul>
                        </div>
                        <div id="rule">
                            <p>Land and Mana</p>
                            <figure id="imageContainer">
                                    <img id="land" src="/img/land.jpg" alt="">
                                    <img id="mana" src="/img/mana.png" alt="">
                            </figure>
                        </div>
                        <div id="rule">
                            <p>Standar card types</p>
                            
                        </div>
                    </div>

                    <div class="turnStructure">
                        <div class="firstRow" id="firstRow">
                            <div title="0" class="arrow">
                                Untap
                            </div>
                            <div title="1" class="arrow">
                                Upkeep
                            </div>
                            <div title="2" class="arrow">
                                Draw
                            </div>
                            <div title="3" class="arrow">
                                Main Phase 1
                            </div>                                                    
                        </div>
                        <div class="secondRow">
                            <div title="4" class="arrow">
                                Combat Phase
                            </div>
                            <div title="5" class="arrow">
                                Main Phase 2
                            </div>
                            <div title="6" class="arrow">
                                End Step
                            </div>
                        </div>
                    </div>

                    <div class="lineContainer">
                        <hr id="firstLine">
                    </div>

                    <div class="explainContainer">
                        <div class="explainStep" id="explainStep">
                            
                        </div>
                        <div class="castSpells">
                            Casting Spells
                        </div>
                    </div>
                </div>
                <div class="termContainer">
                    <div>

                    </div>
                    <div>

                    </div>
                    <div>

                    </div>
                    <div>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div id="footerContainer">
            <div id="footerContent">
            </div>
        </div>
    </footer>
</body>
</html>
